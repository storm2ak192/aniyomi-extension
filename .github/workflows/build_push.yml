name: CI

# Builds and publishes ONLY the Anime3rb extension, signed with its own key (repository
# secrets). Other extensions stay in the source tree untouched and are neither built nor
# signed here.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish Anime3rb
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.ANIME3RB_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANIME3RB_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/anime3rb.jks"
          cp "$RUNNER_TEMP/anime3rb.jks" signingkey.jks
          FP=$(keytool -list -v -keystore signingkey.jks -storepass "$KS_PASS" | grep 'SHA256:' | head -1 | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
          echo "SIGNING_FP=$FP" >> "$GITHUB_ENV"
          echo "Signing certificate SHA-256: $FP"

      - name: Build Anime3rb only
        env:
          ALIAS: anime3rb
          KEY_STORE_PASSWORD: ${{ secrets.ANIME3RB_KEY_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANIME3RB_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :src:ar:anime3rb:assembleRelease -x spotlessKotlinCheck -x spotlessKotlin --stacktrace

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME" -name apksigner -type f | sort | tail -1)
          APK=$(ls src/ar/anime3rb/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
          grep -qi "SHA-256 digest: $SIGNING_FP" /tmp/certs.txt
          AAPT2=$(find "$ANDROID_HOME" -name aapt2 -type f | sort | tail -1)
          "$AAPT2" dump badging "$APK" | grep -E "^package:|application-label:"

      - name: Collect build outputs
        run: |
          mkdir -p out
          cp src/ar/anime3rb/build/outputs/apk/release/*.apk out/
          cp src/ar/anime3rb/build/source-info.json out/

      - name: Clone repo branch
        run: |
          git clone --depth 1 --branch repo \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace only the Anime3rb entry
        run: |
          python3 .github/scripts/update_anime3rb_index.py "$GITHUB_WORKSPACE/out" "$GITHUB_WORKSPACE/repo" "$GITHUB_WORKSPACE" "$SIGNING_FP"

      - name: Push repo branch
        run: |
          cd repo
          git config user.name "github-actions"
          git config user.email "action@github.com"
          git add -A
          if [ -n "$(git status --porcelain)" ]; then
            git commit -q -m "Replace Anime3rb extension"
            git push origin repo
          else
            echo "No changes"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove signing key from workspace
        if: always()
        run: rm -f signingkey.jks "$RUNNER_TEMP/anime3rb.jks"
